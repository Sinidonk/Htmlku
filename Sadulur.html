<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>sadudulur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<noscript><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{--ink:#0E2F2A;--leaf:#1E5B4C;--brass:#B5862B;--mist:#EDF1EC;--card:#fff;--line:#D4DDD5;--rose:#8C3B3B;--tx:#17302b;--mut:#5f7771;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--mist:#0B1B18;--card:#12302A;--line:#25483F;--tx:#E6EFEA;--mut:#93ADA5;--ink:#06120F;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 Figtree,system-ui,sans-serif;background:var(--mist);color:var(--tx);min-height:100vh;padding:calc(6px + env(safe-area-inset-top,0px)) 10px calc(64px + env(safe-area-inset-bottom,0px))}
body.mo{padding-bottom:calc(min(46vh,380px) + 100px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--mist) url(https://sinidonk.github.io/Gbrku/Latar.jpg) center/cover no-repeat}
h1,h2,h3{font-family:Amiri,serif;margin:0}
/* Jam lingkaran */
.clk{display:flex;flex-direction:column;align-items:center;margin:18px 0 8px}
.cf{position:relative;width:min(78vw,320px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#134238,#0A211D 75%);border:3px solid var(--brass);box-shadow:0 0 0 6px rgba(14,47,42,.85),0 0 0 8px rgba(181,134,43,.7),0 0 28px rgba(255,216,61,.35),0 10px 26px rgba(0,0,0,.5)}
.cf .lg{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);object-fit:contain;opacity:.92;border-radius:50%}
.cf svg{position:absolute;inset:0;width:100%;height:100%}
.cf .tk{stroke:#E8D9A8;stroke-width:1.2}.cf .tk.h{stroke:#FFD83D;stroke-width:2.6}
.cf text{fill:#FFD83D;font:700 13px Amiri,serif;text-anchor:middle;dominant-baseline:central}
.cf .hd{transform-origin:100px 100px;stroke-linecap:round}
.cf .hh{stroke:#fff;stroke-width:4.5}.cf .hm{stroke:#7FD8FF;stroke-width:3}.cf .hs{stroke:#FF3B30;stroke-width:1.6}
.cdig{margin-top:14px;padding:4px 18px;border-radius:99px;background:rgba(14,47,42,.88);border:1px solid var(--brass);color:#FFD83D;font:700 1.35rem Amiri,serif;letter-spacing:2px}
.cdat{margin-top:4px;padding:2px 12px;border-radius:99px;background:rgba(14,47,42,.75);color:#fff;font-size:.78rem}
button,input,select{font:inherit;color:inherit}
header{max-width:none;margin:0 -10px 6px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:5px;border-radius:18px;border:1px solid rgba(181,134,43,.55);border-bottom:3px solid var(--brass);box-shadow:0 6px 18px rgba(14,47,42,.18)}
header .ttl{text-align:center;line-height:1.02;border:1px solid rgba(255,216,61,.7);border-radius:14px;padding:4px 18px 5px;width:100%;box-shadow:inset 0 0 10px rgba(255,216,61,.18);font-family:Amiri,serif}
header .ttl div{font-weight:700;letter-spacing:1px}
header .ttl .l1{font-size:clamp(1.05rem,6vw,1.6rem);color:#FFD83D;text-shadow:-1px -1px 0 #0E2F2A,1px -1px 0 #0E2F2A,-1px 1px 0 #0E2F2A,1px 1px 0 #0E2F2A}
header .ttl .l2{font-size:clamp(.8rem,4.4vw,1.25rem);color:#FF3B30;text-shadow:-1px -1px 0 #0E2F2A,1px -1px 0 #0E2F2A,-1px 1px 0 #0E2F2A,1px 1px 0 #0E2F2A}
header .ttl .l3{font-size:clamp(.78rem,4.2vw,1.2rem);color:#7FD8FF;text-shadow:-1px -1px 0 #0E2F2A,1px -1px 0 #0E2F2A,-1px 1px 0 #0E2F2A,1px 1px 0 #0E2F2A}
.hero{background:var(--ink) repeating-conic-gradient(from 45deg at 50% 50%,#ffffff08 0 12.5%,transparent 0 25%) 0 0/46px 46px;color:#fff;text-align:center;padding:6px 8px;border-bottom:3px solid var(--brass)}
.hero h1{font-size:clamp(.85rem,3.9vw,1.4rem);line-height:1.2;margin:0}
.hero .y{color:#FFD83D}
.wrap{max-width:860px;margin:0 auto;padding:0 0 40px}
.in{width:100%;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:3px 0}
.in:focus{outline:2px solid var(--leaf)}
.res{display:flex;flex-direction:column;gap:6px;margin-bottom:0}
.res:empty{display:none}
.res button{text-align:left;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.btn{background:var(--leaf);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:var(--rose)}
.btn.c1{background:#2E7DD1}.btn.c2{background:#D9435A}.btn.c3{background:#E08A00}.btn.c4{background:#1E9C8A}.btn.c5{background:#8E4EC6}
.btn[disabled]{opacity:.4;cursor:default}
.mut{color:var(--mut)}
.two{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:5px;align-items:center}
/* Kotak cari: bingkai luar digelapkan, isi menyala */
.fb{background:linear-gradient(160deg,#061512,#0E2F2A 60%,#134238);border:1px solid var(--brass);border-radius:16px;padding:5px;box-shadow:0 0 0 1px rgba(255,216,61,.25),0 0 22px rgba(255,216,61,.28),0 6px 16px rgba(0,0,0,.35);margin-bottom:6px}
.fb .res{margin-top:6px}
.fb .in{background:#F7FBF4;color:#000;border-color:#FFD83D;box-shadow:0 0 10px rgba(255,216,61,.35)}
.fb .in::placeholder{color:#222;opacity:1}
.fb select.in option{color:#000;background:#fff}
.fb .btn.ib{background:linear-gradient(180deg,#FFFFFF,#DDE8D8);border-color:#FFD83D;box-shadow:0 0 10px rgba(255,216,61,.35),0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 #fff}
.two .in,.two form{min-width:0;margin:0}
.two form .in{margin:0}
.two select.in{height:30px;padding:0 5px;font-size:.8rem}.two form .in{height:30px;padding:0 10px;font-size:.8rem}
.tree{margin-top:8px}
.th{background:linear-gradient(135deg,#0E2F2A,#1E5B4C);color:#fff;border-radius:16px;border-bottom:2px solid var(--brass);padding:4px 8px;margin:0 0 6px;box-shadow:0 3px 10px #0003;display:flex;align-items:center;justify-content:space-between;gap:8px}
.th .btn{flex:none;padding:1px 8px;font-size:.75rem;border-radius:7px}
.th .btn.alt{background:#ffffff22;color:#fff;border:1px solid #ffffff44}
.th .tt{margin:0;flex:1;min-width:0;line-height:1.1;font-size:.85rem;text-align:center}
.th .tt span{display:block;font-size:1em;color:#FFD83D;word-break:break-word}
.kscroll{background:var(--card);border:1px solid rgba(181,134,43,.45);border-radius:22px;padding:12px 10px 8px;overflow-y:auto;overscroll-behavior:contain;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px rgba(181,134,43,.25),0 6px 18px rgba(14,47,42,.10)}
.hint{text-align:center;color:var(--mut);font-size:.8rem;margin:4px 0 8px}
.cp{display:flex;align-items:flex-start;justify-content:center;gap:6px}
.cp>.bx,.sw{flex:1 1 0;max-width:250px}
.sw{min-width:0}
.cp .bx{height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1.25;padding:4px 8px;font-size:.85rem}
.bx{background:var(--mist);border:1.5px solid var(--leaf);border-radius:16px;padding:12px 14px;text-align:center;font-weight:500}
.bx.f{border-color:var(--brass)}
.bx.none{border-style:dashed;color:var(--mut)}
.cp .bx{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:400;cursor:pointer}
.cp .bx.none{background:transparent;color:var(--mut);border-color:var(--line);font-weight:400}
.cp .bx.f{background:var(--brass);border-color:var(--brass);color:#fff}
.mr{flex:none;display:flex;align-items:center;align-self:center}
.hr{display:block}
.hr path{stroke:var(--card);stroke-width:1.2;stroke-linejoin:round}
.lnk{width:2px;height:8px;background:var(--brass);margin:6px auto 0}
.pl{text-align:center;color:#1F5FBF;font:700 .95rem Amiri,serif;border:1.5px solid #1F5FBF;border-radius:99px;width:max-content;margin:0 auto -12px;padding:0 14px;position:relative;z-index:3;background:var(--card)}
/* Garis ke tengah setiap kotak anak */
.kg{margin-top:0}
.kr{display:flex;justify-content:center;gap:10px;padding-top:16px;position:relative}
.kr+.kr{margin-top:10px}
.kr+.kr::before{content:"";position:absolute;left:50%;margin-left:-1px;top:-10px;width:2px;height:10px;background:var(--brass)}
.kc{width:calc((100% - 20px)/3);min-width:0;position:relative}
.kc::before{content:"";position:absolute;left:50%;margin-left:-1px;top:-16px;width:2px;height:16px;background:var(--brass)}
.kc::after{content:"";position:absolute;top:-16px;margin-top:-1px;height:2px;left:-5px;right:-5px;background:var(--brass)}
.kc:first-child::after{left:50%}
.kc:last-child::after{right:50%}
.kc:only-child::after{display:none}
.kg .bx{position:relative;z-index:1;width:100%;cursor:pointer;font-size:.78rem;padding:8px 5px;height:76px;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1.25;word-break:break-word;background:#2E7DD1;border-color:#1F5FBF;color:#fff;font-weight:400}
.kg .bx.m,.kg .bx.f{background:#2E7DD1;border-color:#1F5FBF;color:#fff}
.kg .bx.hl{background:#2E7DD1;color:#fff;box-shadow:0 0 0 3px #FFD83D}
.kg .bx small{display:block;font-weight:400;color:#fff;opacity:.85}
.bx>div{max-width:100%;word-break:break-word}
.bk{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(860px,100%);z-index:70;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--mist);border-top:1px solid var(--line)}
.bk .btn{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 6px;margin:0;font-size:.85rem;font-weight:700;border-radius:10px;white-space:nowrap;cursor:pointer}
.bk .btn svg{flex:none}
.bk .r{background:#E5484D;color:#fff}.bk .b{background:#2E7DD1;color:#fff}.bk .y{background:#FFD83D;color:#000}
/* Keterangan di bawah diagram */
.ket{margin:14px 4px 6px;padding:10px 12px 8px;background:#F7FBF4;border:1px solid var(--brass);border-radius:14px;font-size:.82rem;line-height:1.55;color:#000;text-align:center}
.ket p{margin:0 0 6px;font-style:italic;color:#000}
.ket ol{margin:0;padding:0;list-style:none;columns:2;column-gap:14px;text-align:left;counter-reset:k}
.ket li{counter-increment:k;break-inside:avoid;padding:1px 0;color:#000}
.ket li::before{content:counter(k) ". ";color:#7a560f}
.dd{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.dd button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}
.pen{background:none;border:0;color:inherit;opacity:.75;cursor:pointer;padding:0 6px;font-size:1em;vertical-align:middle}
.nt{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.nt b{font-weight:600}
.lk{display:block;background:none;border:0;text-align:left;padding:6px 0;cursor:pointer;color:var(--brass);text-decoration:underline}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--mut);padding:6px 0}

/* ===== Panel (modal): kecil, mengambang, berwarna ===== */
#modal{position:fixed;inset:0;background:rgba(6,18,15,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal>div{position:relative;background:linear-gradient(90deg,#E5484D,#F5A524,#2FA084,#2E7DD1,#8E4EC6) top left/100% 5px no-repeat,var(--card);width:min(380px,100%);max-height:min(70vh,520px);overflow:auto;border-radius:22px;padding:18px 14px 14px;border:1px solid var(--brass);box-shadow:0 12px 34px rgba(0,0,0,.4)}
#modal.fl{background:transparent;pointer-events:none;align-items:flex-end;padding:0 14px calc(60px + env(safe-area-inset-bottom,0px))}
#modal.fl>div{pointer-events:auto;height:min(46vh,380px);max-height:none}
#modal h3{font-size:1.15rem;margin:0 0 6px;color:var(--brass)}
#modal label{display:block;font-size:.74rem;font-weight:700;letter-spacing:.03em;color:#2FA084;margin-top:7px}
#modal .in{padding:5px 10px;font-size:.88rem;border-radius:9px;margin:2px 0}
#modal .btn{padding:6px 11px;font-size:.82rem;border-radius:9px}
#modal .row{margin-top:10px;gap:6px}
#modal .nt{margin-top:8px;padding:10px;background:rgba(46,125,209,.07);border:1px dashed #2E7DD1}
#modal .lk{font-size:.88rem}
#modal small{font-size:.78rem}
.mx{float:right;position:sticky;top:0;z-index:2;width:28px;height:28px;margin:-6px -2px 0 6px;padding:0;border:0;border-radius:50%;background:#E5484D;color:#fff;font-size:.85rem;line-height:1;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;z-index:80;display:none;max-width:90vw;text-align:center;border:1px solid var(--brass);font-size:.9rem}
@keyframes fl{0%,65%{box-shadow:0 0 0 5px #FFD83D}100%{box-shadow:0 0 0 0 transparent}}
.new{animation:fl 3.2s}
.btn.ib{width:30px;height:30px;padding:0;border-radius:9px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line)}
.btn.ib svg{display:block;width:24px;height:24px;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.45))}
.btn.ib.buat{color:#2FA084}.btn.ib:active{background:var(--mist)}
.btn.ib.edit{color:#B5862B}
.two.w{grid-template-columns:30px 1fr 30px}
.wl{max-width:420px;margin:18px auto 0;text-align:center;background:linear-gradient(160deg,#061512,#0E2F2A 60%,#134238);border:1px solid var(--brass);border-radius:22px;padding:16px 14px 18px;box-shadow:0 0 22px rgba(255,216,61,.28),0 6px 16px rgba(0,0,0,.35);color:#fff}
.wl h2{color:#FFD83D;font-size:1.4rem;margin-bottom:4px}
.wl p{margin:0 0 12px;font-size:.85rem;opacity:.85}
.wl .btn{width:100%;margin-top:8px;padding:14px;font-size:1.05rem;font-weight:700}
.rl{display:flex;justify-content:center;align-items:center;gap:8px;font-size:.72rem;margin:0 0 5px;color:var(--tx)}
.rl b{color:var(--brass)}
.rl button{background:none;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.78rem;cursor:pointer;background:var(--card)}
.gt{max-width:340px;margin:4px auto 0;text-align:center;background:linear-gradient(160deg,#061512,#0E2F2A 60%,#134238);border:1px solid var(--brass);border-radius:20px;padding:12px;color:#fff;box-shadow:0 0 22px rgba(255,216,61,.28),0 6px 16px rgba(0,0,0,.35)}
.gt h2{color:#FFD83D;font-size:.95rem;margin:0;white-space:nowrap}
.gr{display:flex;align-items:center;gap:8px;background:linear-gradient(160deg,#061512,#134238);border:1px solid var(--brass);border-radius:16px;padding:6px 8px;box-shadow:0 0 0 1px rgba(255,216,61,.25),0 0 14px rgba(255,216,61,.3)}.gr select.in{flex:1;min-width:0;height:30px;padding:0 8px;font-size:.85rem;border-radius:10px;border-color:#FFD83D;box-shadow:0 0 8px rgba(255,216,61,.35)}.gt select.in option{color:#000;background:#fff}
.gt form{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.gt .in{background:#F7FBF4;color:#000;border-color:#FFD83D;margin:0}
.gt .btn{margin-top:2px}
.tb{display:flex;gap:6px;flex-wrap:nowrap}
.tb button{flex:1 1 0;min-width:0;padding:3px 8px;font-size:.76rem;font-weight:700;border-radius:99px;border:1px solid var(--brass);background:transparent;color:#FFD83D;cursor:pointer;white-space:nowrap}
.tb button.on{background:#FFD83D;color:#000}
.rb{max-width:340px;margin:0 auto 5px}
.rb button{background:var(--card);color:var(--tx)}
.rb button.on{background:var(--ink);color:#FFD83D}
.rb button.x{flex:0 0 auto;background:#E5484D;border-color:#E5484D;color:#fff}
.pf{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--brass);border-radius:20px;padding:14px}
.pf h2{color:var(--brass);font-size:1.2rem;margin:0 0 4px}
.pf label{display:block;font-size:.76rem;font-weight:700;color:#2FA084;margin-top:8px}
.pf .btn{margin-top:12px;width:100%}
.pw{position:relative}
.pw .in{padding-right:42px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:5px;color:var(--mut);cursor:pointer;display:flex}
.gt .pw .eye{color:#333}
#modal .pw .in{padding-right:40px}
.ck{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;margin:4px 0;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:#FFD83D}
html,body{height:100%}
body{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header{flex:none}
#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#app>.wrap{flex:1 1 auto;min-height:0;width:100%;padding-bottom:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}

#app>.wrap>.tree{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:0}
.tree>*{flex:none}
.tree>.kscroll{flex:1 1 auto;min-height:0}
body.nb:not(.mo){padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const LS='saduduluran_data',LS_DEV='saduduluran_dev';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S={persons:{}},V={pid:null,si:0,role:null,tab:'tree'},db=null,fx=null,au=null;

addEventListener('pagehide',flushLS);
let dq;const drawSoon=()=>{cancelAnimationFrame(dq);dq=requestAnimationFrame(()=>draw())};

function notes(p,s){
  let h='';
  [p,s].filter(Boolean).forEach(x=>{
    const o=x==p?s:p,rows=sp(x).filter(y=>y.id!=o?.id).map(y=>({y,k:kids(x,y)}));
    if(!rows.length)return;
    const L=x.gender=='P'?['Ibu','suami']:['Ayah','istri'],tot=rows.reduce((a,r)=>a+r.k.length,0);
    h+=`<div class="nt"><b>${L[0]} ${esc(x.name)} mempunyai ${tot} anak dari ${L[1]} yang lain</b>${rows.map((r,i)=>`<button class="lk" data-a="pgo" data-x="${x.id}" data-y="${r.y.id}">${i+1}. ${L[1]} ${esc(r.y.name)}: ${r.k.length?r.k.map(c=>esc(c.name)).join(', '):'belum ada anak'}</button>`).join('')}</div>`;
  });
  return h;
}

/* Keterangan di bawah diagram: daftar anak, atau penjelasan bila belum punya anak */
function jml(ks){
  const l=ks.filter(c=>c.gender!='P').length,pr=ks.length-l,r=[];
  if(l)r.push(l+' putra');if(pr)r.push(pr+' putri');
  return ks.length+' putra-putri'+(l&&pr?' ('+r.join(' dan ')+')':'');
}
function ket(p,s,ks){
  const bin=x=>{const f=P(x.fatherId);return f?(x.gender=='P'?' binti ':' bin ')+esc(f.name):''};
  let t;
  if(s){
    const sw=p.gender=='P'&&s.gender=='L',su=sw?s:p,is=sw?p:s;
    const who=`${nm(su)}${bin(su)} dan ${nm(is)}${bin(is)}`;
    t=ks.length?`Pernikahan ${who} telah dikaruniai ${jml(ks)}, di antaranya:`:`Pernikahan ${who} belum dikaruniai putra maupun putri (tidak memiliki keturunan).`;
  }else{
    t=ks.length?`${nm(p)}${bin(p)} telah dikaruniai ${jml(ks)}, di antaranya:`:`${nm(p)}${bin(p)} belum berpasangan dan tidak memiliki keturunan.`;
  }
  return `<div class="ket"><p>${t}</p>${ks.length?`<ol>${ks.map(c=>`<li>${nm(c)}${c.rel=='tiri'?' (tiri)':''}</li>`).join('')}</ol>`:''}</div>`;
}

function tree(){
  const p=P(V.pid);if(!p)return '';
  const ss=sp(p);if(V.si>=ss.length)V.si=0;
  const s=ss[V.si]||null,ks=kids(p,s);
  const many=ss.length>1,lm=s?sp(s):[],lmany=lm.length>1;
  const spb=s?`<div class="sw"><div class="bx ${s.gender=='P'?'f':''}${s.id==V.nw?' new':''}" data-a="upp" data-id="${s.id}"><div>${nm(s)}${many?' <button class="pen" data-a="dd">▾</button>':''}</div></div>${V.dd=='r'&&many?`<div class="dd">${ss.map((x,i)=>`<button data-a="pk" data-i="${i}">${x.gender=='P'?'Istri':'Suami'}: ${esc(x.name)}</button>`).join('')}</div>`:''}</div>`:'<div class="sw"><div class="bx none">Belum berpasangan</div></div>';
  const rows=[];for(let i=0;i<ks.length;i+=3)rows.push(ks.slice(i,i+3).map((c,j)=>[c,i+j]));
  const kg=ks.length?rows.map(r=>`<div class="kr">${r.map(([c,i])=>`<div class="kc"><div class="bx ${c.gender=='P'?'f':'m'} ${c.id==V.hl?'hl':''}${c.id==V.nw?' new':''}" data-a="go" data-id="${c.id}"><div>${i+1}. ${nm(c)}${c.rel=='tiri'?' (tiri)':''}<small>${c.gender=='P'?'Perempuan':'Laki-laki'}</small></div></div></div>`).join('')}</div>`).join(''):'';
  const lb=`<div class="sw"><div class="bx ${p.gender=='P'?'f':''}${p.id==V.nw?' new':''}" data-a="upp" data-id="${p.id}"><div>${nm(p)}${lmany?' <button class="pen" data-a="dl">▾</button>':''}</div></div>${V.dd=='l'&&lmany?`<div class="dd">${lm.map(x=>`<button data-a="pl" data-id="${x.id}">${x.gender=='P'?'Istri':'Suami'}: ${esc(x.name)}</button>`).join('')}</div>`:''}</div>`,sw=p.gender=='P'&&(!s||s.gender=='L');
  return `<div class="tree"><div class="th">${btn('up','▲','alt')}<h1 class="tt">Silsilah Keluarga<br><span>${esc(((s&&s.gender=='L'&&p.gender!='L')?s:p).name)}</span></h1>${btn('down','▼','alt').replace('class',ks.length?'class':'disabled class')}</div>
  <div class="kscroll"><div class="cp">${sw?spb:lb}${mar(p,s)}${sw?lb:spb}</div>
  ${ks.length?'<div class="lnk"></div><div class="pl">Putra &amp; Putri</div>':''}<div class="kg">${kg}</div>${ket(p,s,ks)}</div></div>`;
}

F.add=async(d,f)=>{
  const k=f.dataset.k,p=k=='e'?null:T(),name=(d.get('name')||'').trim();
  if(!name)return toast('Nama harus diisi');
  if(p){const ex=Object.values(S.persons).find(x=>x.id!=p.id&&x.name.trim().toLowerCase()==name.toLowerCase());if(ex)return A.use({id:ex.id})}
  const id=nid(),n={name,gender:d.get('g')||'L',owner:me(),...(V.user?{ownerUid:V.user.uid}:{}),spouses:[],ord:Date.now(),rel:d.get('rel')||'kandung',dead:d.get('dead')=='1',birth:d.get('birth')||''};
  try{
    if(k=='e'){await put('persons',id,n);closeM();V.pid=id;V.si=0;V.eld=null;draw();toast('Silsilah dibuat');return}
    if(!p)return toast('Pilih orang dulu');
    if(k=='sp'){const old=p.spouses||[],fi=d.get('od')=='first';n.spouses=[p.id];await put('persons',id,n);await put('persons',p.id,{spouses:fi?[id,...old]:[...old,id]});if(p.id==V.pid)V.si=fi?0:old.length}
    if(k=='kid'){const pt=d.get('pt')||null;n.fatherId=p.gender=='L'?p.id:pt;n.motherId=p.gender=='L'?pt:p.id;await put('persons',id,n)}

    b.style.fontSize='';
    const cs=getComputedStyle(b);

}

const anon=async()=>{
  if(!au||V.user)return;
  try{await fx.setPersistence(au,fx.browserLocalPersistence)}catch(e){console.warn('persist',e)}
  try{await fx.signInAnonymously(au)}
  catch(e){console.warn('anon',e);toast('Penanda warga gagal ('+(e.code||e.message)+'). Cek Authentication > Anonymous aktif.',7000)}
};
A.role=()=>{V.role='w';V.gs=false;V.tab='tree';redraw();anon()};
A.tab=d=>{closeM();V.tab=d.t;redraw()};
A.keluar=async()=>{
  closeM();V.tg=null;V.tab='tree';V.gs=false;
  if(au&&V.user&&V.role=='s'){try{await fx.signOut(au)}catch{}V.user=null}
  V.role=null;V.prof=null;redraw();
};
F.login=async d=>{
  if(!au)return toast('Menyambung ke server, coba sebentar lagi');
  let em=(d.get('em')||'').trim().toLowerCase();if(!em)return;if(!em.includes('@'))em+=ALIAS;
  try{try{await fx.setPersistence(au,d.get('keep')?fx.browserLocalPersistence:fx.browserSessionPersistence)}catch(e){console.warn('persist',e)}await fx.signInWithEmailAndPassword(au,em,d.get('pw')||'')}catch(e){toast(aerr(e))}
};
F.prof=async(d,f)=>{
  const u=V.user;if(!u||!db)return toast('Belum tersambung');
  const name=(d.get('name')||'').trim(),phone=(d.get('phone')||'').trim(),em=(d.get('email')||'').trim().toLowerCase(),pw=d.get('pw')||'',cur=d.get('cur')||'';
  if(!name)return toast('Nama harus diisi');
  if(pw&&pw.length<6)return toast('Password minimal 6 karakter');
  const chEm=!isM()&&em&&em!=(u.email||'').toLowerCase();
  try{
    if(pw||chEm){
      if(!cur)return toast('Isi password saat ini');
      await fx.reauthenticateWithCredential(u,fx.EmailAuthProvider.credential(u.email,cur));
    }
    if(pw)await fx.updatePassword(u,pw);
    let msg='Profil tersimpan';
    if(chEm){await fx.verifyBeforeUpdateEmail(u,em);msg='Tersimpan. Buka link verifikasi di email baru'}
    await fx.setDoc(fx.doc(db,'users',u.uid),isM()?{name,phone,email:u.email,role:'master'}:{name,phone},{merge:true});
    V.prof={...(V.prof||{}),name,phone};
    const pid=V.prof.personId;if(pid&&P(pid)&&P(pid).name!=name)await put('persons',pid,{name});
    f.querySelector('[name=pw]').value='';f.querySelector('[name=cur]').value='';
    toast(msg);
  }catch(e){toast(aerr(e))}
};
async function authChanged(u){
  const was=V.role;
  if(!u){V.user=null;V.prof=null;if(was=='s'){V.role=null;V.tab='tree';redraw()}if(V.role=='w')anon();return}
  if(u.isAnonymous){V.user=u;return}
  try{
    const m=(u.email||'').toLowerCase()==MASTER;
    const sn=await fx.getDoc(fx.doc(db,'users',u.uid));
    if(!m&&!sn.exists()){await fx.signOut(au);toast('Akun ini bukan sesepuh');return}
    V.user=u;V.prof=sn.exists()?sn.data():{};V.role='s';V.tab='tree';V.gs=false;
    if(!m&&V.prof.email&&V.prof.email!=u.email)try{await fx.setDoc(fx.doc(db,'users',u.uid),{email:u.email},{merge:true})}catch{}
    redraw();toast('Berhasil masuk');
  }catch(e){try{await fx.signOut(au)}catch{}toast('Gagal memuat akun: '+(e.message||e))}
}

function draw(){
  const app=$('#app');
  document.body.classList.toggle('nb',!isM());
  if(!V.role){
    closeM();
    const sg='g'+(V.gs?1:0);
    if(app.dataset.sig==sg&&app.querySelector('.gt'))return tick();
    app.dataset.sig=sg;app.innerHTML=gateHTML();tick();return;
  }
  if(V.role=='s'&&V.tab=='prof'){
    if(app.dataset.sig=='p'&&app.querySelector('.pf'))return;
    app.dataset.sig='p';app.innerHTML=`<div class="wrap">${barHTML()}${profHTML()}</div>`;return;
  }
  app.dataset.sig='';
  const p=P(V.pid);
  if(!p)V.pid=null;
  const kosong=!Object.keys(S.persons).length;
  app.innerHTML=`<div class="wrap">
    ${barHTML()}
    ${finder()}
    ${kosong?'<p class="mut" style="text-align:center;margin:16px 0">Belum ada data. Tekan <b>Buat</b>.</p>':''}
    ${p?tree():(kosong?'':clockHTML())}
    ${isM()?backupBox():''}
    </div>`;
  fit();tick();
}
A.buat=()=>A.eadd();
A.edit=()=>{
  if(!Object.keys(S.persons).length)return toast('Belum ada data. Tekan Buat dulu.');
  const p=P(V.pid)||Object.values(S.persons).find(x=>x.elder)||Object.values(S.persons)[0];
  if(V.pid!=p.id)V.si=0;V.pid=p.id;draw();
  A.setg(p.id);
};

/* ===== EVENT ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,f=A[a];
  if(f){e.preventDefault();f(b.dataset,b)}
});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.i)return;const f=A[t.dataset.i];if(f)f(t.value)});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-f]');if(!f)return;
  e.preventDefault();
  const d=new FormData(f),fn=F[f.dataset.f];
  if(fn)fn(d,f);
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.c)return;const a=A[t.dataset.c];if(a)a(t.value,t)});

/* ===== JAM ===== */
const clockHTML=()=>{
  let t='';
  for(let i=0;i<60;i++){const h=i%5==0,a=i*6*Math.PI/180,r1=h?84:90,r2=96;t+=`<line class="tk${h?' h':''}" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}"/>`}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;t+=`<text x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)}">${n}</text>`}
  return `<div class="clk"><div class="cf"><img class="lg" src="https://sinidong.github.io/Gbrku/kaum.png" alt="" onerror="this.style.display='none'"><svg viewBox="0 0 200 200" aria-hidden="true">${t}<line class="hd hh" id="ch" x1="100" y1="100" x2="100" y2="56"/><line class="hd hm" id="cm" x1="100" y1="100" x2="100" y2="34"/><line class="hd hs" id="cs" x1="100" y1="112" x2="100" y2="26"/><circle cx="100" cy="100" r="4" fill="#FFD83D"/></svg></div><div class="cdig" id="cd"></div><div class="cdat" id="cdt"></div></div>`;
};
function tick(){
  const c=$('#ch');if(!c)return;
  const n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000,m=n.getMinutes()+s/60,h=(n.getHours()%12)+m/60;
  c.style.transform=`rotate(${h*30}deg)`;$('#cm').style.transform=`rotate(${m*6}deg)`;$('#cs').style.transform=`rotate(${s*6}deg)`;
  const z=x=>String(x).padStart(2,'0');
  $('#cd').textContent=z(n.getHours())+':'+z(n.getMinutes())+':'+z(n.getSeconds());
  $('#cdt').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,250);

/* ===== INIT ===== */
S=readLS();
if(!S.persons)S.persons={};
draw();

if(LIVE){
  Promise.all([import(V9+'firebase-app.js'),import(V9+'firebase-firestore.js'),import(V9+'firebase-auth.js')]).then(([fa,fs,fu])=>{
    fx={...fa,...fs,...fu};
    const app=fa.initializeApp(FB);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
    fs.onSnapshot(fs.collection(db,'persons'),s=>{
      const n={};s.forEach(d=>n[d.id]={id:d.id,...d.data()});
      if(Object.keys(S.persons).length>Object.keys(n).length)snap('data berkurang',S.persons);
      S.persons=n;
      if(!window.__d1){window.__d1=1;const l=bkList();if(!l.length||Date.now()-l[0].t>864e5)snap('harian',n)}
      writeLS();drawSoon();
    },err=>console.warn('snapshot',err));
    try{au=fu.initializeAuth(app,{persistence:[fu.indexedDBLocalPersistence,fu.browserLocalPersistence,fu.browserSessionPersistence]})}catch(e){au=fu.getAuth(app)}
    fu.onAuthStateChanged(au,authChanged);
    Q.splice(0).forEach(f=>f());
  }).catch(e=>{console.warn('firebase',e);toast('Firebase gagal: '+e.message)});
}
