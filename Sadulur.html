<script type="module">
/* ===== CONFIG FIREBASE BARU (project: saduduluran) ===== */
const FB={
  apiKey:"AIzaSyBnWDoyTdWwGzxlq7zfXHVrJWabyLORR1o",
  authDomain:"saduduluran.firebaseapp.com",
  projectId:"saduduluran",
  storageBucket:"saduduluran.firebasestorage.app",
  messagingSenderId:"342702880832",
  appId:"1:342702880832:web:b96716d5d83f103d8947a5"
};
const LIVE=!!FB.apiKey,V9="https://www.gstatic.com/firebasejs/10.12.2/";
const LS='saduduluran_data',LS_DEV='saduduluran_dev';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S={persons:{}},V={pid:null,si:0},db=null,fx=null;
const A={},F={};
const me=()=>{let i=localStorage.getItem(LS_DEV);if(!i){i=nid();localStorage.setItem(LS_DEV,i)}return i};

const readLS=()=>{try{return JSON.parse(localStorage.getItem(LS)||'{"persons":{}}')}catch{return {persons:{}}}};
const flushLS=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch{}};
let wt;const writeLS=()=>{clearTimeout(wt);wt=setTimeout(flushLS,200)};
addEventListener('pagehide',flushLS);
let dq;const drawSoon=()=>{cancelAnimationFrame(dq);dq=requestAnimationFrame(()=>draw())};
const Q=[];const sync=f=>{if(!LIVE)return;db?f():Q.push(f)};

async function put(c,id,d){
  S[c][id]={...(S[c][id]||{}),id,...d};
  writeLS();drawSoon();
  sync(()=>fx.setDoc(fx.doc(db,c,id),d,{merge:true}).catch(e=>{console.warn('put',e);toast('Gagal sinkron: '+e.message)}));
}
async function del(c,id){
  delete S[c][id];writeLS();drawSoon();
  sync(()=>fx.deleteDoc(fx.doc(db,c,id)).catch(e=>console.warn('del',e)));
}

/* ===== HELPER ===== */
const P=id=>S.persons[id];
const sp=p=>(p.spouses||[]).map(P).filter(Boolean);
const sortO=(a,b)=>(a.ord||0)-(b.ord||0);
const kids=(p,s)=>Object.values(S.persons).filter(c=>{if(c.fatherId!=p.id&&c.motherId!=p.id)return false;const o=c.fatherId==p.id?c.motherId:c.fatherId;return s?o==s.id:true}).sort(sortO);
const sibsOf=c=>Object.values(S.persons).filter(x=>(c.fatherId&&x.fatherId==c.fatherId)||(c.motherId&&x.motherId==c.motherId)).sort(sortO);
const rank=c=>{if(!c.fatherId&&!c.motherId)return 0;const sib=sibsOf(c);return sib.findIndex(x=>x.id==c.id)+1};
const btn=(a,t,cls='')=>`<button class="btn ${cls}" data-a="${a}">${t}</button>`;
/* Ikon pernikahan: dua hati menyatu (tetap terlihat keduanya); cerai: dua hati terpisah */
const HP='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
const WED=`<svg class="hr" width="34" height="24" viewBox="0 0 32 24" role="img" aria-label="Menikah"><path d="${HP}" fill="#D9435A" transform="translate(-1 2.5) scale(.9)"/><path d="${HP}" fill="#FF9BB0" transform="translate(11 2.5) scale(.9)"/></svg>`;
const DIV=`<svg class="hr" width="42" height="24" viewBox="0 0 40 24" role="img" aria-label="Cerai"><path d="${HP}" fill="#9AA8A3" transform="translate(-0.5 4) rotate(-14 12 12) scale(.85)"/><path d="${HP}" fill="#C3CCC8" transform="translate(20.5 4) rotate(14 12 12) scale(.85)"/></svg>`;
const isDiv=(a,b)=>!!(a&&b&&((a.div||[]).includes(b.id)||(b.div||[]).includes(a.id)));
const mar=(a,b)=>b?`<div class="mr">${isDiv(a,b)?DIV:WED}</div>`:'';
const al=p=>p.dead?(p.gender=='P'?'Almh. ':'Alm. '):'';
const nm=p=>al(p)+esc(p.name);
const fam=p=>{const f=P(p.fatherId),m=P(p.motherId);return f?(p.gender=='P'?'binti ':'bin ')+f.name:m?'dari '+m.name:p.elder?'Kaum':(p.gender=='P'?'Perempuan':'Laki-laki')};
const hits=v=>{v=v.trim().toLowerCase();return v?Object.values(S.persons).filter(p=>p.name.toLowerCase().includes(v)):[]};
const TI=()=>V.tg||V.pid,T=()=>P(TI());
function age(p){if(!p.birth)return'';const b=new Date(p.birth),n=new Date();let a=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(m<0||(m==0&&n.getDate()<b.getDate()))a--;return a>=0?a+' tahun':''}

function notes(p,s){
  let h='';
  [p,s].filter(Boolean).forEach(x=>{
    const o=x==p?s:p,rows=sp(x).filter(y=>y.id!=o?.id).map(y=>({y,k:kids(x,y)}));
    if(!rows.length)return;
    const L=x.gender=='P'?['Ibu','suami']:['Ayah','istri'],tot=rows.reduce((a,r)=>a+r.k.length,0);
    h+=`<div class="nt"><b>${L[0]} ${esc(x.name)} mempunyai ${tot} anak dari ${L[1]} yang lain</b>${rows.map((r,i)=>`<button class="lk" data-a="pgo" data-x="${x.id}" data-y="${r.y.id}">${i+1}. ${L[1]} ${esc(r.y.name)}: ${r.k.length?r.k.map(c=>esc(c.name)).join(', '):'belum ada anak'}</button>`).join('')}</div>`;
  });
  return h;
}

/* ===== TREE ===== */
A.pgo=d=>pairGo(P(d.x),P(d.y));
A.dd=()=>{V.dd=V.dd=='r'?false:'r';draw()};
A.dl=()=>{V.dd=V.dd=='l'?false:'l';draw()};
A.pl=d=>pairGo(P(d.id),sp(P(V.pid))[V.si]);
A.pk=d=>{V.si=+d.i;V.dd=false;draw()};

/* Keterangan di bawah diagram: daftar anak, atau penjelasan bila belum punya anak */
function jml(ks){
  const l=ks.filter(c=>c.gender!='P').length,pr=ks.length-l,r=[];
  if(l)r.push(l+' putra');if(pr)r.push(pr+' putri');
  return ks.length+' putra-putri'+(l&&pr?' ('+r.join(' dan ')+')':'');
}
function ket(p,s,ks){
  const bin=x=>{const f=P(x.fatherId);return f?(x.gender=='P'?' binti ':' bin ')+esc(f.name):''};
  let t;
  if(s){
    const sw=p.gender=='P'&&s.gender=='L',su=sw?s:p,is=sw?p:s;
    const who=`${nm(su)}${bin(su)} dan ${nm(is)}${bin(is)}`;
    t=ks.length?`Pernikahan ${who} telah dikaruniai ${jml(ks)}, di antaranya:`:`Pernikahan ${who} belum dikaruniai putra maupun putri (tidak memiliki keturunan).`;
  }else{

function tree(){

  const rows=[];for(let i=0;i<ks.length;i+=3)rows.push(ks.slice(i,i+3).map((c,j)=>[c,i+j]));

  <p class="hint">Silakan ketuk nama</p>

  ${ks.length?'<div class="lnk"></div><div class="pl">Putra &amp; Putri</div>':''}<div class="kg">${kg}</div>${ket(p,s,ks)}${notes(p,s)}</div></div>`;
}

  const id=nid(),n={name,gender:d.get('g')||'L',owner:me(),spouses:[],ord:Date.now(),rel:d.get('rel')||'kandung',dead:d.get('dead')=='1',birth:d.get('birth')||''};
  try{
    if(k=='e'){n.elder=true;await put('persons',id,n);closeM();V.pid=id;V.si=0;draw();toast('Kaum ditambahkan');return}
    if(!p)return toast('Warga orang dulu');

    if(k=='kid'){const pt=d.get('pt')||null;n.fatherId=p.gender=='L'?p.id:pt;n.motherId=p.gender=='L'?pt:p.id;await put('persons',id,n)}
    if(k=='par'){const L=d.get('role')=='L';n.gender=L?'L':'P';await put('persons',id,n);await put('persons',p.id,{[L?'fatherId':'motherId']:id})}
    if(k=='sib'){const t=d.get('st');if((t!='seibu'&&!p.fatherId)||(t!='seayah'&&!p.motherId))throw{message:'Tambahkan orang tua dahulu'};if(t!='seibu')n.fatherId=p.fatherId;if(t!='seayah')n.motherId=p.motherId;await put('persons',id,n)}
    if(k=='rel'){const t=d.get('rt'),X=P(d.get('sd')=='M'?p.motherId:p.fatherId);if(!X)throw{message:'Tambahkan ayah/ibu dahulu'};if(t=='kk'){await put('persons',id,n);await put('persons',X.id,{[n.gender=='L'?'fatherId':'motherId']:id})}else{if(!X.fatherId&&!X.motherId)throw{message:'Tambahkan kakek/nenek dahulu'};n.fatherId=X.fatherId||null;n.motherId=X.motherId||null;n.ord=(X.ord||0)+(t=='uwa'?-5:5);await put('persons',id,n)}}
    V.nw=id;setTimeout(()=>{V.nw=null;draw()},3300);closeM();draw();toast('Tersimpan');A.setg(p.id)
  }catch(e){toast(e.message||'Gagal menyimpan')}

const BK='saduduluran_bak';
const bkList=()=>{try{return JSON.parse(localStorage.getItem(BK)||'[]')}catch{return []}};
function snap(why,data){
  const src=data||S.persons;if(!Object.keys(src).length)return;
  const l=bkList();l.unshift({t:Date.now(),why,n:Object.keys(src).length,p:src});
  while(l.length>5)l.pop();
  try{localStorage.setItem(BK,JSON.stringify(l))}catch{l.length=Math.min(l.length,2);try{localStorage.setItem(BK,JSON.stringify(l))}catch{}}
}
A.bsave=()=>{

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));
  a.download='sakaum-cadangan-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Cadangan disimpan ke perangkat');

async function restore(ps){
  const n=Object.keys(ps).length;if(!n)return toast('Cadangan kosong');
  if(!confirm('Pulihkan '+n+' orang dari cadangan? Data yang sudah ada tidak dihapus.'))return;
  snap('sebelum pulihkan');
  for(const [id,p] of Object.entries(ps))await put('persons',id,{...p});
  closeM();toast('Data dipulihkan ('+n+' orang)');
}

  r.readAsText(f);
};

};
A.brest=d=>{const x=bkList()[+d.i];if(x)restore(x.p)};
const IS={sv:`<svg ${IC}><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`,au:`<svg ${IC}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,pu:`<svg ${IC}><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>`};
const backupBox=()=>`<div class="bk"><button class="btn r" data-a="bsave">${IS.sv}Simpan</button><button class="btn b" data-a="bauto">${IS.au}Otomatis</button><label class="btn y">${IS.pu}Pulihkan<input type="file" accept=".json,application/json" data-c="bfile" hidden></label></div>`;

/* ===== RENDER ===== */
function modal(h,fl){
  const m=$('#modal');
  m.innerHTML=`<div>${fl?'':'<button type="button" class="mx" data-a="closeM" aria-label="Tutup">✕</button>'}${h}</div>`;
  m.className='on'+(fl?' fl':'');
  document.body.classList.toggle('mo',!!fl);
  m.onclick=e=>{if(e.target==m)closeM()};
}
function closeM(){const m=$('#modal');m.className='';m.innerHTML='';document.body.classList.remove('mo')}
A.closeM=()=>closeM();
addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2500)}

/* Perkecil huruf otomatis sampai nama utuh muat di kotak (tanpa dipotong) */
function fit(){
  document.querySelectorAll('.cp .bx,.kg .bx').forEach(b=>{
    const d=b.firstElementChild;if(!d)return;
    b.style.fontSize='';
    const cs=getComputedStyle(b);
    let fs=parseFloat(cs.fontSize);
    const room=()=>b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    while(d.offsetHeight>room()&&fs>7){fs-=.5;b.style.fontSize=fs+'px'}
  });
}
addEventListener('resize',fit);
document.fonts&&document.fonts.ready.then(fit);

function draw(){
  const p=P(V.pid);
  if(!p)V.pid=null;
  const kosong=!Object.keys(S.persons).length;
  $('#app').innerHTML=`<!-- <section class="hero"><h1><span class="y">sakaum</span><br>Silsilah Keluarga</h1></section> -->
    <div class="wrap">
    ${finder()}
    ${kosong?'<p class="mut" style="text-align:center;margin:16px 0">Belum ada data. Tekan <b>Buat</b>.</p>':''}
    ${p?tree():(kosong?'':clockHTML())}
    ${backupBox()}
    </div>`;
  fit();tick();
}
A.buat=()=>A.eadd();
A.edit=()=>{
  if(!Object.keys(S.persons).length)return toast('Belum ada data. Tekan Buat dulu.');
  const p=P(V.pid)||Object.values(S.persons).find(x=>x.elder)||Object.values(S.persons)[0];
  V.pid=p.id;V.si=0;draw();
  A.setg(p.id);
};

/* ===== EVENT ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,f=A[a];
  if(f){e.preventDefault();f(b.dataset,b)}
});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.i)return;const f=A[t.dataset.i];if(f)f(t.value)});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-f]');if(!f)return;
  e.preventDefault();
  const d=new FormData(f),fn=F[f.dataset.f];
  if(fn)fn(d,f);
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.c)return;const a=A[t.dataset.c];if(a)a(t.value,t)});

/* ===== JAM ===== */
const clockHTML=()=>{
  let t='';
  for(let i=0;i<60;i++){const h=i%5==0,a=i*6*Math.PI/180,r1=h?84:90,r2=96;t+=`<line class="tk${h?' h':''}" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}"/>`}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;t+=`<text x="${100+70*Math.sin(a)}" y="${100-70*Math.cos(a)}">${n}</text>`}
  return `<div class="clk"><div class="cf"><img class="lg" src="https://sinidong.github.io/Gbrku/kaum.png" alt="" onerror="this.style.display='none'"><svg viewBox="0 0 200 200" aria-hidden="true">${t}<line class="hd hh" id="ch" x1="100" y1="100" x2="100" y2="56"/><line class="hd hm" id="cm" x1="100" y1="100" x2="100" y2="34"/><line class="hd hs" id="cs" x1="100" y1="112" x2="100" y2="26"/><circle cx="100" cy="100" r="4" fill="#FFD83D"/></svg></div><div class="cdig" id="cd"></div><div class="cdat" id="cdt"></div></div>`;
};
function tick(){
  const c=$('#ch');if(!c)return;
  const n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000,m=n.getMinutes()+s/60,h=(n.getHours()%12)+m/60;
  c.style.transform=`rotate(${h*30}deg)`;$('#cm').style.transform=`rotate(${m*6}deg)`;$('#cs').style.transform=`rotate(${s*6}deg)`;
  const z=x=>String(x).padStart(2,'0');
  $('#cd').textContent=z(n.getHours())+':'+z(n.getMinutes())+':'+z(n.getSeconds());
  $('#cdt').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,250);

/* ===== INIT ===== */
S=readLS();
if(!S.persons)S.persons={};
draw();

if(LIVE){
  Promise.all([import(V9+'firebase-app.js'),import(V9+'firebase-firestore.js')]).then(([fa,fs])=>{
    fx={...fa,...fs};
    const app=fa.initializeApp(FB);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(app)}
    fs.onSnapshot(fs.collection(db,'persons'),s=>{
      const n={};s.forEach(d=>n[d.id]={id:d.id,...d.data()});
      if(Object.keys(S.persons).length>Object.keys(n).length)snap('data berkurang',S.persons);
      S.persons=n;
      if(!window.__d1){window.__d1=1;const l=bkList();if(!l.length||Date.now()-l[0].t>864e5)snap('harian',n)}
      writeLS();drawSoon();
    },err=>console.warn('snapshot',err));
    Q.splice(0).forEach(f=>f());
  }).catch(e=>{console.warn('firebase',e);toast('Firebase gagal: '+e.message)});
}
</script>
